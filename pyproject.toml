[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldforge-crystalite-analysis"
version = "0.1.0"
description = "Reproducible analysis and visualization for FieldForge and Crystalite crystal-generation benchmarks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.23",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "pymatgen>=2024.5.1",
  "pymatviz>=0.10.1",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools]
py-modules = []

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
